[project]
name = "order-tracker-incident-response"
version = "0.1.0"
description = "Local incident collection and coding-assistant launcher for Order Tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["test_app.py"]
