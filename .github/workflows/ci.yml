name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv sync --directory incident-response --frozen
      - run: uv run --directory incident-response --frozen pytest -q
